name: Verify and deploy AxiomCAM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiomcam-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run core regression tests
        run: |
          set -euo pipefail
          npm test | tee tests/core-results.tap
      - name: Rebuild standalone app and computed examples
        run: |
          npm run build
          npm run examples
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser verification dependencies
        run: |
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Verify browser workflows under the Pages project path
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/axiomcam-webroot"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/axiomcam-webroot/AxiomCAM"
          python -m http.server 8080 --bind 127.0.0.1 --directory "$RUNNER_TEMP/axiomcam-webroot" > "$RUNNER_TEMP/axiomcam-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/AxiomCAM/ > /dev/null && break || sleep 1
          done
          python tests/browser-integration.py --url http://127.0.0.1:8080/AxiomCAM/ | tee tests/browser-ci.log
          cp ../axiomcam-preview.png docs/preview.png
      - name: Stage static site and build provenance
        run: |
          mkdir -p _site
          cp index.html AxiomCAM.html LICENSE README.md BUILD_INFO.json _site/
          cp -R src styles docs examples _site/
          touch _site/.nojekyll
          git rev-parse HEAD > _site/commit.txt
          python - <<'PY'
          import datetime, hashlib, json, os, pathlib
          root = pathlib.Path('_site')
          report = json.loads(pathlib.Path('tests/browser-results.json').read_text())
          metadata = {
              'commit': pathlib.Path('_site/commit.txt').read_text().strip(),
              'workflowRun': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'builtAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'browserChecks': len(report['checks']),
              'browserMode': report['mode'],
              'renderer': report['renderer'],
              'pageErrors': report['pageErrors'],
              'hardwareWebGPUBenchmark': False,
              'machineQualification': 'None; independent controller-specific review is required.'
          }
          (root/'deployment.json').write_text(json.dumps(metadata, indent=2)+'\n')
          entries = [f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}' for p in sorted(root.rglob('*')) if p.is_file() and p.name != 'MANIFEST.sha256']
          (root/'MANIFEST.sha256').write_text('\n'.join(entries)+'\n')
          PY
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            tests/core-results.tap
            tests/browser-results.json
            tests/browser-ci.log
            docs/preview.png
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure enabled Pages site
        uses: actions/configure-pages@v5
      - name: Deploy AxiomCAM
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public deployment and asset integrity
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYVERIFY'
          import hashlib, os, time, urllib.request
          base = os.environ['SITE_URL'].rstrip('/')+'/'
          expected = os.environ['EXPECTED_SHA']
          def fetch(path, attempt=0):
              url = base+path+'?revision='+expected+'&attempt='+str(attempt)
              with urllib.request.urlopen(url, timeout=20) as response:
                  return response.read()
          for attempt in range(20):
              try:
                  if fetch('commit.txt', attempt).decode().strip() == expected:
                      break
              except Exception as error:
                  print('Deployment propagation check:', type(error).__name__)
              time.sleep(5)
          else:
              raise SystemExit('Public site did not expose the expected commit.')
          manifest = dict((path, digest) for digest, path in
              (line.split('  ', 1) for line in fetch('MANIFEST.sha256').decode().splitlines()))
          paths = ['index.html', 'AxiomCAM.html', 'styles/app.css', 'src/app.js',
                   'src/worker.js', 'src/cam.js', 'src/geometry.js', 'src/project.js',
                   'src/renderer.js', 'src/simulation.js', 'src/post.js', 'deployment.json']
          for path in paths:
              actual = hashlib.sha256(fetch(path)).hexdigest()
              if actual != manifest.get(path):
                  raise SystemExit('Public asset checksum mismatch: '+path)
              print('HTTP + SHA-256 verified:', path)
          print('Published and verified:', base, 'commit', expected)
          PYVERIFY
